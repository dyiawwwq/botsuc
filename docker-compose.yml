services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_FILE: /app/data/bot.sqlite3
    volumes:
      - bot-data:/app/data

# To swap SQLite for Postgres in production: add a `postgres:16` service
# here, point a new Postgres-backed implementation of src/db/repositories/*
# at it (see README "Limitations" — the repositories are plain SQL, so this
# is a contained change), and remove the bot-data volume above.
volumes:
  bot-data:
